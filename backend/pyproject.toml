[project]
name = "seo-platform-backend"
version = "2.0.0"
description = "AI SEO Intelligence Platform backend"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.16.4",
    "aiosqlite==0.20.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "textstat==0.7.5",
    "google-generativeai==0.8.3",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.19",
    "aiofiles==24.1.0",
    "cachetools==5.5.0",
    "tenacity==9.0.0",
    "tldextract==5.1.3",
    "slowapi==0.1.9",
    "greenlet==3.1.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.0.1",
    "asyncpg==0.30.0",
    "playwright==1.49.1",
    "openpyxl==3.1.5",
    "mcp==2.1.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*", "auth*", "alembic*"]
